name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# This workflow only checks repository contents and never needs write access.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Unit tests
        working-directory: backend
        run: uv run python -m unittest discover app/tests

# E2B 不可用时的受控 Linux Docker 本地执行覆盖文件。
# 仅限单用户、可信本机 Docker；不要与 docker-compose.dev.yml 同时使用。
services:
  backend:
    environment:
      # A stale proxy in backend/.env.dev must not break the trusted local
      # default after a normal Compose rebuild.  Use direct HTTPS unless this
      # workstation explicitly opts in through the root .env file.
      LLM_OUTBOUND_PROXY: "${MMA_LLM_OUTBOUND_PROXY:-}"
      CODE_INTERPRETER_KIND: local
      ALLOW_LOCAL_CODE_EXECUTION: "true"
      # Long ODE simulations need one bounded completion window. The interpreter
      # watchdog still interrupts a stalled Jupyter IOPub receive.
      LOCAL_CODE_EXECUTION_TIMEOUT_SECONDS: "300"
    cap_drop:
      - ALL
    # Backend uses these only to manage shared task files, prepare, and terminate the
    # dedicated Jupyter child; the child drops all privileges before model code runs.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Local model-code execution can occupy the backend event loop for several
    # minutes while a notebook cell runs. Keep the container health signal
    # useful without treating that expected workload as an immediate restart.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; raise SystemExit(0 if urlopen('http://127.0.0.1:8000/docs', timeout=10).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 15s
      retries: 36
      start_period: 20s

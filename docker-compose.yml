# docker-compose.yml

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    # 不映射端口到宿主机——后端通过 compose 内部网络以服务名 redis 连接，
    # 本地开发用宿主机的 redis-mma（端口 6379），两者互不冲突。
    volumes:
      - redis_data:/data # Redis 数据的持久化存储卷

  backend:
    build:
      context: ./backend # Dockerfile 的上下文路径
      dockerfile: Dockerfile # Dockerfile 文件名
    container_name: mathmodelagent_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # 仅允许本机通过前端代理或调试端口访问后端
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; raise SystemExit(0 if urlopen('http://127.0.0.1:8000/docs', timeout=2).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    env_file:
      - ./backend/.env.dev #从此文件加载环境变量
    environment:
      - ENV=DEV # 为后端显式设置 ENV
      - REDIS_URL=redis://redis:6379/0 # 覆盖 .env.dev 中的 127.0.0.1，容器内用服务名连 Redis
      - SERVER_HOST=http://localhost:5173/api # Docker 前端通过 Vite /api 代理访问后端，下载链接也走同一入口
    volumes:
      - ./backend:/app # 挂载后端代码以实现热重载 (开发环境)
      - ./backend/project/work_dir:/app/project/work_dir # 持久化生成的文件
      - backend_venv:/app/.venv # 可选：持久化 venv 以在依赖不变时加快后续构建速度
      - "${MMA_OFFICIAL_FONTS_DIR:-./backend/fonts}:/usr/local/share/fonts/mma-extra:ro" # 可选：挂载宿主机合法安装的正式字体；Windows 可在根目录 .env 设置 MMA_OFFICIAL_FONTS_DIR=C:\Windows\Fonts
    depends_on:
      redis:
        condition: service_healthy
    stdin_open: true # 保持标准输入打开
    tty: true      # 分配一个伪终端

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mathmodelagent_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173" # WebUI 仅绑定本机，避免默认暴露到局域网
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    env_file:
      - ./frontend/.env.docker # 加载前端的环境变量（docker-compose 场景下后端映射在宿主机 8000，与本地开发用的 .env.development(8003) 区分）
    volumes:
      - ./frontend:/app # 挂载前端代码以实现热重载 (开发环境)
      - /app/node_modules # 匿名卷，防止主机的 node_modules 覆盖容器内的
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  redis_data: # 定义用于 Redis 持久化的命名卷
  backend_venv: # 定义用于后端 venv 的命名卷
